name: The Daily Dose morning edition
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 5 * * *'
      timezone: America/New_York
    - cron: '17 6 * * *'
      timezone: America/New_York
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily-dose-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch fresh morning headlines
        run: python update_daily.py
      - name: Package public website only
        run: |
          mkdir dist
          cp index.html daily.js content.json manifest.webmanifest apple-touch-icon.png favicon.png icon-192.png icon-512.png dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish edition
        id: deploy
        uses: actions/deploy-pages@v4
